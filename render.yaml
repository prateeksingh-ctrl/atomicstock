databases:
  - name: atomicstock-db
    plan: free
    databaseName: inventory_db
    user: admin

services:
  # 1. Express Backend Web Service
  - type: web
    name: atomicstock-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npx prisma db seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atomicstock-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: admin@tier1.com
      - key: PORT
        value: 3000
      - key: CLIENT_URL
        value: https://atomicstock-frontend.onrender.com

  # 2. Vite React Frontend (Static Site)
  - type: web
    name: atomicstock-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://atomicstock-backend.onrender.com
