services:
  # 1. PostgreSQL Database
  - type: pg
    name: atomicstock-db
    plan: free
    ipAllowList: []

  # 2. Redis Cache
  - type: redis
    name: atomicstock-redis
    plan: free
    ipAllowList: []

  # 3. Express Backend Web Service
  - type: web
    name: atomicstock-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atomicstock-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: atomicstock-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: admin@tier1.com
      - key: PORT
        value: 3000

  # 4. Vite React Frontend (Static Site)
  - type: web
    name: atomicstock-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: atomicstock-backend
          property: host

