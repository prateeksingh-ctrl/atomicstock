version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: p022_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: p022_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: